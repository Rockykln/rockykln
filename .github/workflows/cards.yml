name: cards

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw cards
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: python3 tools/cards.py cards --user "${{ github.repository_owner }}" --out dist
      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update cards"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
