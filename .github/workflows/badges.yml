name: badges

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md", "tools/**", ".github/workflows/badges.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redraw badges and test the Rust block in README.md
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: python3 tools/badges_update.py

      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update badges"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
